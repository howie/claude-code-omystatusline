name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    # Build cgo-free: the project has zero cgo, and on macos-latest the stdlib net
    # cgo resolver (pulled in by net/http in pkg/apilimits) forces external linking
    # with Apple's ld, producing test binaries without an LC_UUID load command that
    # newer dyld aborts on. CGO_ENABLED=0 keeps everything on Go's internal linker
    # (always writes LC_UUID) and matches the cgo-free binaries release.yml ships.
    env:
      CGO_ENABLED: "0"
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        go-version: ['1.21', '1.22', '1.23']

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
      continue-on-error: true

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Build
      run: go build -v -o statusline-go ./cmd/statusline

    - name: Run tests
      run: go test -count=1 ./...

    - name: Run go vet
      run: go vet ./...

    - name: Run go fmt check
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "The following files need formatting:"
          gofmt -s -l .
          exit 1
        fi

    - name: Test shell wrapper
      run: |
        # Copy binary to scripts directory for testing
        cp statusline-go scripts/statusline-go
        chmod +x scripts/statusline-wrapper.sh
        chmod +x scripts/statusline-go
        echo '{}' | ./scripts/statusline-wrapper.sh

    - name: Upload binary artifact
      uses: actions/upload-artifact@v4
      if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.23'
      with:
        name: statusline-go-linux
        path: statusline-go
        retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: latest
        args: --timeout=5m
